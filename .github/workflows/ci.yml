# CI 门禁（设计说明见 docs/CI_GATES.md）。
#
# - 第三方 action 固定到完整 commit SHA（标签仅作注释），升级由 Dependabot / 人工 PR。
# - 本文件属于 L3 风险等级（config/risk-policy.toml），修改需要人工确认。
# - 分支保护应把下列 job 名称设为必需检查：rust、web、python-websearch、python-tools、
#   change-policy、security（python-dlp-egress 建议一并设为必需）。
#
# T1 路径分流（#432，设计 docs/fencing/INTEGRATION_PIPELINE.md 第 5 节）：
# - `triage` 作业按改动路径产出各作业开关；rust/web/python-* 作业 `needs` 它并按开关跳过。
# - 被跳过的必需检查在 GitHub 分支保护中按「成功」处理（作业级 if 跳过 ≠ 检查缺失）；
#   若保护规则表现异常，回退方案是各作业内早退成功退出。
# - 底线不降：`change-policy`、`security` 每个 PR 照跑；master push 全量（triage 对非 PR
#   事件直接输出全量）；triage 自身任何异常回退全量（tools/ci/ci_path_triage.py fail-safe）。

name: ci

on:
  pull_request:
  push:
    branches: [master]

# 同一 PR 的新提交会取消旧的运行；master 上的运行不取消，保证每个合并提交都有完整记录。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认只读；需要写权限的 job 单独声明（目前没有）。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 与 AGENTS.md 的完成定义一致：所有 cargo 命令使用 target 目录。
  CARGO_TARGET_DIR: target

jobs:
  # ---------- T1 路径分流 ----------
  # 只做 git diff + 判定（无工具链），改动文件按 tools/ci/ci_path_triage.py 的规则映射到作业开关。
  triage:
    name: triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 计算作业开关
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p triage
          if [ "$EVENT" != "pull_request" ]; then
            python3 tools/ci/ci_path_triage.py --event push --json-out triage/result.json --quiet
          elif git cat-file -e "origin/${BASE_REF:-master}" 2>/dev/null; then
            BASE_SHA="$(git merge-base "origin/${BASE_REF:-master}" HEAD)"
            git diff --name-only "$BASE_SHA" | python3 tools/ci/ci_path_triage.py --event pull_request --json-out triage/result.json
          else
            # 基准分支取不到时宁可全量，不可漏跑。
            python3 tools/ci/ci_path_triage.py --event push --json-out triage/result.json --quiet
          fi
      - name: 落输出
        run: |
          set -euo pipefail
          echo "run_rust=$(jq -r .rust triage/result.json)" >> "$GITHUB_OUTPUT"
          echo "run_web=$(jq -r .web triage/result.json)" >> "$GITHUB_OUTPUT"
          echo "run_python_websearch=$(jq -r '.["python-websearch"]' triage/result.json)" >> "$GITHUB_OUTPUT"
          echo "run_python_dlp_egress=$(jq -r '.["python-dlp-egress"]' triage/result.json)" >> "$GITHUB_OUTPUT"
          echo "run_python_tools=$(jq -r '.["python-tools"]' triage/result.json)" >> "$GITHUB_OUTPUT"
        id: switches
    outputs:
      run_rust: ${{ steps.switches.outputs.run_rust }}
      run_web: ${{ steps.switches.outputs.run_web }}
      run_python_websearch: ${{ steps.switches.outputs.run_python_websearch }}
      run_python_dlp_egress: ${{ steps.switches.outputs.run_python_dlp_egress }}
      run_python_tools: ${{ steps.switches.outputs.run_python_tools }}

  # ---------- Rust ----------
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: triage
    if: needs.triage.outputs.run_rust == 'true'
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # 钉死版本（与 rust-toolchain.toml 一致）。钉到 commit SHA 时必须显式传 toolchain，
      # 否则 action 报 'toolchain' is a required input。
      # dtolnay/rust-toolchain@master（2026-11 pin）
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # cargo test 按顺序逐个运行测试二进制（#437 实测 7m33s，其中编译 2m23s）。
      # 改用 nextest 把各二进制的串行时间重叠起来（并行、失败输出可读）；
      # doc-test 不在 nextest 覆盖范围内，单独保留。
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-nextest
      - name: cargo nextest（并行跑全部单元/集成测试）
        run: cargo nextest run --locked --workspace
      - name: cargo test --doc（doc-test 单独跑）
        run: cargo test --locked --doc

      - name: bindings 是否最新
        run: |
          cargo test --locked -p an-core
          git diff --exit-code -- web/src/bindings

  # ---------- 前端 ----------
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: triage
    if: needs.triage.outputs.run_web == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 功能地图与 features.json 一致性（AGENTS.md 要求同步）
      - run: npm run test:map
      - run: npm run build

  # ---------- Python：websearch 工具 ----------
  python-websearch:
    name: python-websearch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: triage
    if: needs.triage.outputs.run_python_websearch == 'true'
    defaults:
      run:
        working-directory: tools/websearch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: uv sync --frozen
      - name: 测试与覆盖率（阈值 80%，见 pyproject.toml）
        run: uv run pytest --cov --cov-report=term
      - name: flake8
        run: uv run flake8 .

  # ---------- Python：外发脱敏 MCP 工具 ----------
  python-dlp-egress:
    name: python-dlp-egress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: triage
    if: needs.triage.outputs.run_python_dlp_egress == 'true'
    defaults:
      run:
        working-directory: tools/dlp-egress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - run: uv sync --frozen
      - name: 测试与覆盖率（阈值 80%，见 pyproject.toml）
        run: uv run pytest --cov --cov-report=term
      - name: flake8
        run: uv run flake8 .

  # ---------- Python：CI 策略脚本本身 ----------
  python-tools:
    name: python-tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: triage
    if: needs.triage.outputs.run_python_tools == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      - name: pytest（策略脚本）
        working-directory: tools/ci
        run: uv run --no-project --python 3.13 --with pytest python -m pytest -q
      - name: flake8（策略脚本）
        run: uv run --no-project --python 3.13 --with flake8 flake8 --max-line-length 100 tools/ci

  # ---------- 风险分级与变更规模 ----------
  change-policy:
    name: change-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-python@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: 风险分级
        run: python3 tools/ci/risk_classify.py --json-out risk.json
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: 变更规模
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/ci/change_size_check.py
      - name: 提示注入扫描
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/ci/injection_scan.py --json-out injection.json
      # 文档检查（docs/DOC_SYSTEM_PLAN.md 第 4.3 节）。过渡期只警告：脚本默认退出码 0，
      # 另加 continue-on-error 兜底；约一周后加 --strict 并去掉 continue-on-error。
      - name: 文档检查（只警告）
        continue-on-error: true
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/ci/doc_lint.py --json-out doc-lint.json
      # actions/upload-artifact@v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: risk-report
          path: |
            risk.json
            injection.json
            doc-lint.json
          if-no-files-found: ignore

  # ---------- 安全 ----------
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: npm audit（生产依赖）
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      # gitleaks/gitleaks-action@v3
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
