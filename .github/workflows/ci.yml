# CI 门禁（设计说明见 docs/CI_GATES.md）。
#
# - 第三方 action 固定到完整 commit SHA（标签仅作注释），升级由 Dependabot / 人工 PR。
# - 本文件属于 L3 风险等级（config/risk-policy.toml），修改需要人工确认。
# - 分支保护应把下列 job 名称设为必需检查：rust、web、python-websearch、python-tools、
#   change-policy、security（python-dlp-egress 建议一并设为必需）。

name: ci

on:
  pull_request:
  push:
    branches: [master]

# 同一 PR 的新提交会取消旧的运行；master 上的运行不取消，保证每个合并提交都有完整记录。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认只读；需要写权限的 job 单独声明（目前没有）。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 与 AGENTS.md 的完成定义一致：所有 cargo 命令使用 target 目录。
  CARGO_TARGET_DIR: target

jobs:
  # ---------- Rust ----------
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # 钉死版本（与 rust-toolchain.toml 一致）。钉到 commit SHA 时必须显式传 toolchain，
      # 否则 action 报 'toolchain' is a required input。
      # dtolnay/rust-toolchain@master（2026-11 pin）
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

      - name: bindings 是否最新
        run: |
          cargo test --locked -p an-core
          git diff --exit-code -- web/src/bindings

  # ---------- 前端 ----------
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 功能地图与 features.json 一致性（AGENTS.md 要求同步）
      - run: npm run test:map
      - run: npm run build

  # ---------- Python：websearch 工具 ----------
  python-websearch:
    name: python-websearch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/websearch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --frozen
      - name: 测试与覆盖率（阈值 80%，见 pyproject.toml）
        run: uv run pytest --cov --cov-report=term
      - name: flake8
        run: uv run flake8 .

  # ---------- Python：外发脱敏 MCP 工具 ----------
  python-dlp-egress:
    name: python-dlp-egress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/dlp-egress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --frozen
      - name: 测试与覆盖率（阈值 80%，见 pyproject.toml）
        run: uv run pytest --cov --cov-report=term
      - name: flake8
        run: uv run flake8 .

  # ---------- Python：CI 策略脚本本身 ----------
  python-tools:
    name: python-tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: pytest（策略脚本）
        working-directory: tools/ci
        run: uv run --no-project --python 3.13 --with pytest python -m pytest -q
      - name: flake8（策略脚本）
        run: uv run --no-project --python 3.13 --with flake8 flake8 --max-line-length 100 tools/ci

  # ---------- 风险分级与变更规模 ----------
  change-policy:
    name: change-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-python@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: 风险分级
        run: python3 tools/ci/risk_classify.py --json-out risk.json
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: 变更规模
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/ci/change_size_check.py
      - name: 提示注入扫描
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/ci/injection_scan.py --json-out injection.json
      # actions/upload-artifact@v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: risk-report
          path: |
            risk.json
            injection.json
          if-no-files-found: ignore

  # ---------- 安全 ----------
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: npm audit（生产依赖）
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      # gitleaks/gitleaks-action@v3
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
