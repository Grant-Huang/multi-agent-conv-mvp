# AgentNexus MVP 配置模板。复制为 config.toml 后按需修改：
#   cp config.example.toml config.toml

[server]
bind = "127.0.0.1:8787"            # 后端监听地址；前端构建后也从这里访问
db_path = "data/agentnexus.db"     # SQLite 数据库
static_dir = "web/dist"            # 前端构建产物（npm run build 之后才有）

# ───── 本地模型（llama.cpp 的 OpenAI 兼容接口）─────
[llm]
base_url = "http://127.0.0.1:8098/v1"
api_key = ""                       # llama.cpp 默认不需要
model = "local"                    # llama.cpp 单模型时模型名基本被忽略
temperature = 0.2
max_tokens = 2048
timeout_secs = 180
# 结构化输出方式：
#   json_schema  —— OpenAI 标准写法，较新的 llama.cpp 会把 schema 转成语法约束（推荐）
#   json_object  —— llama.cpp 旧的扩展写法 {"type":"json_object","schema":...}
#   prompt_only  —— 不做语法约束，只靠提示词（任何服务都能用，小模型格式错误会多）
structured_mode = "json_schema"
max_retries = 2                    # 输出不合格时把错误反馈给模型重试的次数

# ───── 按角色指定不同模型（可选）─────
# 只有一个 llama.cpp 实例时不用管。多个模型（例如用 llama-swap 按模型名切换）时，
# 可以让 Router 用更小更快的模型，General 用更大的模型。
[models]
# conversation = "qwen3-4b"      # 前台判断"这一轮做什么"，输出很短，适合小而快的模型
# reply = "qwen3-8b"             # 直接回答用户时生成回复（不填则与 conversation 相同）
# router = "qwen3-1.7b"          # 判断交给哪类执行者
# general = "qwen3-8b"
# reviewer = "qwen3-8b"
# 不同角色的模型跑在不同的 llama.cpp 实例（端口）上时，用 base_urls 分别指定；不写则用 [llm].base_url。
# reply 没单独配置模型时，模型和地址都跟 conversation 一致。
# [models.base_urls]
# conversation = "http://127.0.0.1:8201/v1"
# reply = "http://127.0.0.1:8201/v1"
# router = "http://127.0.0.1:8201/v1"
# general = "http://127.0.0.1:8200/v1"
# reviewer = "http://127.0.0.1:8200/v1"

# ───── 后端与路由（可选，推荐）─────
# 后端 = 一个推理服务 + 它的限流方式。不写 [backends] 时，用上面的 [llm] 合成一个不限并发的 default 后端，行为和以前一样。
# 写了 [backends] 就不能再用 [models.base_urls]（旧写法）；[models] 里的模型名仍然可以覆盖。
# 密钥只能从环境变量读取（api_key_env 写变量名，不要把密钥写进这个文件）。
#
# 方案 A：全本地。35B 开 6 个槽位（llama-server -np 6），槽位 0-1 给前台对话，2-5 给后台任务
# [backends.local]
# kind = "llama_cpp"
# base_url = "http://127.0.0.1:8200/v1"
# slots = 6                          # 必须和 llama-server 的 -np 一致
# interactive_slots = [0, 1]         # 前台使用的槽位；不写则 slots=1 时共用 0，否则前台 [0]、后台其余
# background_slots = [2, 3, 4, 5]    # 后台任务只能用这些槽位；写 [] 表示这个后端不接后台角色
# borrow_idle = false                # 默认不借用；true = 前台槽位全忙时可借用空闲的后台槽位（后台不会借前台槽位）
# [routing]
# conversation = "local"
# router = "local"
# general = "local"
# reviewer = "local"
#
# 方案 B：本地模型只做前台（2-4 个槽位全给对话），后台任务用云端模型
# [backends.local]
# kind = "llama_cpp"
# base_url = "http://127.0.0.1:8200/v1"
# slots = 3
# interactive_slots = [0, 1, 2]
# background_slots = []
# [backends.cloud]
# kind = "openai"
# base_url = "https://api.example.com/v1"
# model = "cloud-model"
# api_key_env = "CLOUD_API_KEY"      # 启动前 export CLOUD_API_KEY=...
# max_inflight = 8                   # 同时最多 8 个请求，0 = 不限
# reserved_interactive = 1           # 其中 1 个预留给前台
# rpm = 60                           # 每分钟请求数上限，0 = 不限
# tpm = 200000                       # 每分钟 token 上限，0 = 不限
# [routing]
# conversation = "local"
# router = "local"
# general = "cloud"
# reviewer = "cloud"
#
# 其他可选项：model、structured_mode、context_tokens（0 = 从服务读取）、queue_secs（排队等槽位 / 并发许可的最长时间，
# 超时报"忙"；默认前台 30 秒、后台 600 秒）、connect_secs / first_token_secs / idle_secs / total_secs（分段超时）、
# deadline_secs（前台调用含重试的期限，默认 60，0 = 不限）、
# extra_body = { chat_template_kwargs = { enable_thinking = false } }（附加到每个请求体）

# ───── 前台行为 ─────
[conversation]
# 用户发起的"审查 / 评估 / 检查"类请求怎么处理：
#   reviewer —— 一律交给独立审查（有记录和证据，但多一轮后台任务）
#   direct   —— 对话里直接给出的内容由前台直接回答；需要读文件或仓库的仍交给后台
#   auto     —— 短内容直接回答；长内容（约 30 行 / 1500 字以上）、文件、仓库交给后台
review_requests = "reviewer"
stream_replies = true             # 直接回答时边生成边显示

# ───── Agents ─────
[agents.general]
enabled = true
max_steps = 6                      # 工具循环最大步数
max_concurrent = 4                 # 同时最多执行几个任务（受本地模型并发能力限制）
workspace_dir = "workspace/files"  # 文件工具只能读写这个目录

[agents.reviewer]
enabled = true

[agents.coding]
enabled = true
command = "~/.npm-global/bin/codex"   # 支持 ~ 开头
# 参数模板，占位符：{prompt} 任务描述、{workdir} 工作目录、{last_message_file} Codex 最后回复的输出文件
# 不同版本的 codex 参数可能不同，请先运行 `codex exec --help` 核对
args = ["exec", "--skip-git-repo-check", "--sandbox", "workspace-write", "--cd", "{workdir}", "--output-last-message", "{last_message_file}", "{prompt}"]
workdir = "workspace/code"         # 建议指向一个独立的 git 仓库（会收集 git diff 作为审查证据）
timeout_secs = 900
# 改用其他命令行编码 agent 时，同时改 id / name / agent_type（默认 codex / Codex CLI / codex），例如 pi：
# id = "pi"
# name = "pi"
# agent_type = "pi"
# command = "~/.npm-global/bin/pi"
# args = ["-p", "--no-session", "{prompt}"]

# ───── 执行组：每个角色由哪些 agent 来做（可选）─────
# 不配置时，每个角色用它第一个可用的 agent（顺序：内置 → Codex → 本机 ACP → 节点）。
# 写一个：指定由谁来做。写多个：第一个是主力，后面是待命的备份，主力忙满时分担任务。
# 规则：只能写同一类型的 agent（例如都是 hermes）；执行出错会直接报错，不会换人重做。
# 节点上的 agent 写成 "agent id@节点名"，可以在界面「诊断」页看到准确的 id。
[agents.assign]
# coding = "opencode"
# general = ["hermes@mac-mini", "hermes@office-pc"]

# ───── 通过 ACP（Agent Client Protocol）接入外部 agent ─────
# 新手什么都不用配：本机装了 opencode / hermes / pi-acp，启动时会被自动发现。
[acp]
auto_detect = true

# 接入其他支持 ACP 的 agent，最少只要三行（id、command、role）：
# [[acp.agents]]
# id = "my-agent"
# command = "my-agent"          # 命令名或路径（支持 ~）
# args = ["acp"]                # 启动 ACP 模式的参数，见该 agent 的文档
# role = "coding"               # general / coding / reviewer
# 可选项：
# name = "我的 Agent"            # 显示名称
# workdir = "~/projects/demo"   # 不填：coding 用代码目录，其他用文件目录
# permission = "allow_all"      # agent 请求权限时：allow_all / read_only / deny_all
# timeout_secs = 1800
# env = { API_KEY = "..." }

# 可选项还有：max_concurrent = 1（同时最多执行几个任务）、agent_type = "hermes"（类型，默认取命令名）
#
# 想先体验 ACP 接入？用自带的模拟 agent（cargo build --release 后可用）：
# [[acp.agents]]
# id = "mock"
# command = "./target/release/an-mock-acp"
# role = "coding"

# ───── 其他电脑上的 agent（节点）─────
# 在那台电脑上运行 an-node，它会显示配对码；然后在本界面的「节点」页配对即可。
[nodes]
discovery = true                   # 自动发现局域网中的节点（网络屏蔽组播时，可在界面按地址添加）
refresh_secs = 15                  # 多久检查一次节点是否在线

# ───── 日志（用于自动排查问题）─────
[logging]
dir = "logs"                       # JSON 日志目录，按天滚动；留空表示不写文件
level = "info"                     # error / warn / info / debug

[orchestrator]
max_review_rounds = 1              # Reviewer 判 fail 后最多返工几轮
history_messages = 12              # 每轮带上最近多少条消息
task_timeout_secs = 1800           # 单个任务总超时
approval_risk = "high"             # 风险达到该等级需人工审批：low / medium / high
