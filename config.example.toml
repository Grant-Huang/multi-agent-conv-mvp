# AgentNexus MVP 配置模板。复制为 config.toml 后按需修改：
#   cp config.example.toml config.toml

[server]
bind = "127.0.0.1:8787"            # 后端监听地址；前端构建后也从这里访问
db_path = "data/agentnexus.db"     # SQLite 数据库
static_dir = "web/dist"            # 前端构建产物（npm run build 之后才有）

# ───── 本地模型（llama.cpp 的 OpenAI 兼容接口）─────
[llm]
base_url = "http://127.0.0.1:8098/v1"
api_key = ""                       # llama.cpp 默认不需要。云端后端建议改用 api_key_env（契约 K2：不要把明文密钥写进配置文件）
# api_key_env = "LLM_API_KEY"      # 凭据引用：指向存放密钥的环境变量；设置后优先于 api_key
model = "local"                    # llama.cpp 单模型时模型名基本被忽略
temperature = 0.2
max_tokens = 4096                  # 各角色第一次生成的输出上限。General 写长文时再提高到至少 8192
timeout_secs = 300                  # 首 token 之前的整次上限。开始输出后不再用它截断，只看 45 秒空闲间隔
# 结构化输出方式：
#   json_schema  —— OpenAI 标准写法，较新的 llama.cpp 会把 schema 转成语法约束（推荐）
#   json_object  —— llama.cpp 旧的扩展写法 {"type":"json_object","schema":...}
#   prompt_only  —— 不做语法约束，只靠提示词（任何服务都能用，小模型格式错误会多）
structured_mode = "json_schema"
max_retries = 2                    # 输出不合格时把错误反馈给模型重试的次数

# ───── 按角色指定不同模型（可选）─────
# 只有一个 llama.cpp 实例时不用管。多个模型（例如用 llama-swap 按模型名切换）时，
# 可以让 Router 用更小更快的模型，General 用更大的模型。
[models]
# conversation = "qwen3-4b"      # 前台判断"这一轮做什么"，输出很短，适合小而快的模型
# reply = "qwen3-8b"             # 直接回答用户时生成回复（不填则与 conversation 相同）
# router = "qwen3-1.7b"          # 判断交给哪类执行者
# general = "qwen3-8b"
# reviewer = "qwen3-8b"
# mom_reviewer = "qwen3-32b"     # MOM 车间仿真的 AI 审核；不填则用 [llm].model（与 MOM 主 agent 同模型，报告标注"非独立审核"）
#                                 注意：真实审核模型尚未接入（LlmReviewer 未实现），此项目前不生效；
#                                 AI 审核接口会返回 "no reviewer configured; rules only"，只给规则检查结果。
# 不同角色的模型跑在不同的 llama.cpp 实例（端口）上时，用 base_urls 分别指定；不写则用 [llm].base_url。
# reply 没单独配置模型时，模型和地址都跟 conversation 一致。
# [models.base_urls]
# conversation = "http://127.0.0.1:8201/v1"
# reply = "http://127.0.0.1:8201/v1"
# router = "http://127.0.0.1:8201/v1"
# general = "http://127.0.0.1:8200/v1"
# reviewer = "http://127.0.0.1:8200/v1"

# ───── 后端与路由（可选，推荐）─────
# 后端 = 一个推理服务 + 它的限流方式。不写 [backends] 时，用上面的 [llm] 合成一个不限并发的 default 后端，行为和以前一样。
# 写了 [backends] 就不能再用 [models.base_urls]（旧写法）；[models] 里的模型名仍然可以覆盖。
# 密钥只能从环境变量读取（api_key_env 写变量名，不要把密钥写进这个文件）。
#
# 方案 A：全本地。35B 开 6 个槽位（llama-server -np 6），槽位 0-1 给前台对话，2-5 给后台任务
# [backends.local]
# kind = "llama_cpp"
# base_url = "http://127.0.0.1:8200/v1"
# slots = 6                          # 必须和 llama-server 的 -np 一致
# interactive_slots = [0, 1]         # 前台使用的槽位；不写则 slots=1 时共用 0，否则前台 [0]、后台其余
# background_slots = [2, 3, 4, 5]    # 后台任务只能用这些槽位；写 [] 表示这个后端不接后台角色
# borrow_idle = false                # 默认不借用；true = 前台槽位全忙时可借用空闲的后台槽位（后台不会借前台槽位）
# [routing]
# conversation = "local"
# router = "local"
# general = "local"
# reviewer = "local"
#
# 方案 B：本地模型只做前台（2-4 个槽位全给对话），后台任务用云端模型
# [backends.local]
# kind = "llama_cpp"
# base_url = "http://127.0.0.1:8200/v1"
# slots = 3
# interactive_slots = [0, 1, 2]
# background_slots = []
# [backends.cloud]
# kind = "openai"
# base_url = "https://api.example.com/v1"
# model = "cloud-model"
# api_key_env = "CLOUD_API_KEY"      # 启动前 export CLOUD_API_KEY=...
# max_inflight = 8                   # 同时最多 8 个请求，0 = 不限
# reserved_interactive = 1           # 其中 1 个预留给前台
# rpm = 60                           # 每分钟请求数上限，0 = 不限
# tpm = 200000                       # 每分钟 token 上限，0 = 不限
# [routing]
# conversation = "local"
# router = "local"
# general = "cloud"
# reviewer = "cloud"
#
# 其他可选项：model、structured_mode、context_tokens（0 = 从服务 /props 读取，用于裁剪过长的提示词）、
# context_shared（上下文是否被所有槽位共享：llama_cpp 默认是，每个请求只能用 总量÷槽位数；openai 默认否）、queue_secs（排队等槽位 / 并发许可的最长时间，
# 超时报"忙"；默认前台 30 秒、后台 600 秒）、connect_secs / first_token_secs / idle_secs / total_secs（分段超时）、
# deadline_secs（前台调用含重试的期限，默认 60，0 = 不限）、
# extra_body = { chat_template_kwargs = { enable_thinking = false } }（附加到该后端的每一次调用）
# front_structured_thinking = false（只关闭 conversation / router 结构化请求的思考，直接回答和后台任务不变）
# 以下两项是前台提速实验（FT，见 docs/PLAN.md），只在 front_structured_thinking = false 时生效，默认不开：
# front_reason_first = true（A：先写不超过 40 字的判断依据再给结论）
# front_thinking_escalation = true（D：格式不合格、风险 high、角色没有可用 agent 时开思考重判一次）
# 用 an-eval 对比时不必改这里：cargo run --release --bin an-eval -- config.toml --variant E4

# ───── 前台行为 ─────
[conversation]
# 用户发起的"审查 / 评估 / 检查"类请求怎么处理：
#   reviewer —— 一律交给独立审查（有记录和证据，但多一轮后台任务）
#   direct   —— 对话里直接给出的内容由前台直接回答；需要读文件或仓库的仍交给后台
#   auto     —— 短内容直接回答；长内容（约 30 行 / 1500 字以上）、文件、仓库交给后台
review_requests = "reviewer"
stream_replies = true             # 直接回答时边生成边显示
# 会话资料注入（第 5 线）：回答路径把任务回执 / 个人记忆 / 相关内省发现作为「数据，非指令」并入提示词。默认开启。
# session_materials = true
# session_materials_max_tokens = 2048   # 资料块 token 预算（含页眉）
# session_materials_timeout_ms = 200     # 读资料超时则本轮不加资料、仍正常回答
# session_materials_findings_max = 2     # 最多注入几条相关内省发现
# 前台提速实验（FT）B：路由后按规则把风险只升不降（删除 / 对外发送 / 部署 → high，写文件 / 改代码 → 至少 medium）。默认不开
# risk_rules = true
# 前台提速实验（FT.5）Q：路由不直接选 L1–L4，改为回答"需要取数工具吗""需要生成文档吗"两个是/否问题，
# 由代码算出类别。与是否思考无关。默认不开（本机实验未通过，见 docs/DECISIONS.md 第 42 条）
# route_class_questions = true
# 前台提速实验（FT.5b）T：general 任务的类别改由路由列出的工具清单算出
# （有 write_file 以外的工具 = 要取数；有 write_file 或模型给 L3/L4 = 要文档）。只改结果，不改请求。默认不开
# route_class_from_tools = true

# ───── Agents ─────
[agents.general]
enabled = true
max_steps = 6                      # 工具循环最大步数
report_max_searches = 6            # 研究报告全文检索次数上限（去重后）
report_parallel = 3                # 研究报告同时写作的章节数（后台槽位留 1 个给其他任务）
max_concurrent = 4                 # 同时最多执行几个任务（受本地模型并发能力限制）
workspace_dir = "workspace/files"  # 文件工具只能读写这个目录
websearch_command = "websearch"    # 不在 PATH 上时不注册联网工具
websearch_timeout_secs = 45

[agents.reviewer]
enabled = true

[agents.coding]
enabled = true
command = "~/.npm-global/bin/codex"   # 支持 ~ 开头
# 参数模板，占位符：{prompt} 任务描述、{workdir} 工作目录、{last_message_file} Codex 最后回复的输出文件
# 不同版本的 codex 参数可能不同，请先运行 `codex exec --help` 核对
args = ["exec", "--skip-git-repo-check", "--sandbox", "workspace-write", "--cd", "{workdir}", "--output-last-message", "{last_message_file}", "{prompt}"]
workdir = "workspace/code"         # 建议指向一个独立的 git 仓库（会收集 git diff 作为审查证据）
timeout_secs = 900
# 改用其他命令行编码 agent 时，同时改 id / name / agent_type（默认 codex / Codex CLI / codex），例如 pi：
# id = "pi"
# name = "pi"
# agent_type = "pi"
# command = "~/.npm-global/bin/pi"
# args = ["-p", "--no-session", "{prompt}"]
# pi 直连本地 llama.cpp 时，让它只用后台槽位、不占前台：填上面 [backends.<名>] 的名字。
# 每个任务启动前先向调度器申请一个后台槽位，槽位号通过环境变量 AN_LLM_SLOT 交给 pi；
# 还需要在 pi 里装一个很小的扩展把它写进请求的 id_slot（见 docs/PLAN.md 的 pre-M3.5）。
# max_concurrent 不能超过该后端的后台槽位数，建议 ≤ 2（给 general / reviewer 留槽位）。pi 用云端模型时不要写 backend。
# backend = "local"
# max_concurrent = 2

# ───── 执行组：每个角色由哪些 agent 来做（可选）─────
# 不配置时，每个角色用它第一个可用的 agent（顺序：内置 → Codex → 本机 ACP → 节点）。
# 写一个：指定由谁来做。写多个：第一个是主力，后面是待命的备份，主力忙满时分担任务。
# 规则：只能写同一类型的 agent（例如都是 hermes）；执行出错会直接报错，不会换人重做。
# 节点上的 agent 写成 "agent id@节点名"，可以在界面「诊断」页看到准确的 id。
[agents.assign]
# coding = "opencode"
# general = ["hermes@mac-mini", "hermes@office-pc"]

# ───── 通过 ACP（Agent Client Protocol）接入外部 agent ─────
# 新手什么都不用配：本机装了 opencode / hermes / pi-acp / claude-agent-acp / codex-acp /
# cursor-agent / zcode-acp-server，启动时会被自动发现（id 见 docs/DESIGN.md 7.2）。
[acp]
auto_detect = true

# 接入其他支持 ACP 的 agent，最少只要三行（id、command、role）：
# [[acp.agents]]
# id = "my-agent"
# command = "my-agent"          # 命令名或路径（支持 ~）
# args = ["acp"]                # 启动 ACP 模式的参数，见该 agent 的文档
# role = "coding"               # general / coding / reviewer
# 可选项：
# name = "我的 Agent"            # 显示名称
# workdir = "~/projects/demo"   # 不填：coding 用代码目录，其他用文件目录
# permission = "allow_all"      # agent 请求权限时：allow_all / read_only / deny_all
# timeout_secs = 1800
# env = { API_KEY = "..." }

# 可选项还有：max_concurrent = 1（同时最多执行几个任务）、agent_type = "hermes"（类型，默认取命令名）
#
# 想先体验 ACP 接入？用自带的模拟 agent（cargo build --release 后可用）：
# [[acp.agents]]
# id = "mock"
# command = "./target/release/an-mock-acp"
# role = "coding"

# ───── 其他电脑上的 agent（节点）─────
# 在那台电脑上运行 an-node，它会显示配对码；然后在本界面的「节点」页配对即可。
[nodes]
discovery = true                   # 自动发现局域网中的节点（网络屏蔽组播时，可在界面按地址添加）
refresh_secs = 15                  # 多久检查一次节点是否在线

# ───── 日志（用于自动排查问题）─────
[logging]
dir = "logs"                       # JSON 日志目录，按天滚动；留空表示不写文件
level = "info"                     # error / warn / info / debug

[orchestrator]
max_review_rounds = 1              # Reviewer 判 fail 后最多返工几轮
history_messages = 12              # 每轮带上最近多少条消息
task_timeout_secs = 1800           # 单个任务超时：从第一次分到 agent 开始计时，排队不算
approval_risk = "high"             # 风险达到该等级需人工审批：low / medium / high

# ───── agent 准入与持续信任（E3，可选，默认关闭）─────
# 只约束运行时接入的外部 agent（kind = "a2a"）；上面配置的 agent 视为已信任。
# 开启后：按准入等级分配任务（Guest 只做低风险、Member 到中风险、Trusted 不限），
# 结果交回时核对凭证代际，降级或撤权后旧凭证交回的结果不被接受。默认值取自论文 §5.2。
# [admission]
# enabled = true
# sample_rate = 0.2                # 试用期抽检比例
# failures_per_warning = 2         # 连续几次不合格记一次警告
# warnings_to_downgrade = 3        # 累计几次警告降为 Guest
# member_score = 60.0              # 总分达到此值推荐 Member
# trusted_score = 80.0             # 总分达到此值推荐 Trusted（必须人工审批）
# member_requires_approval = false
# seed = 0
# [admission.weights]
# completeness = 0.3
# conversation = 0.2
# test = 0.5

# ───── MCP：General 的轻量工具 Harness（可选）─────
# 只启动自己信任、已安装的服务；command/args 不是 shell，不自动下载软件。
# 实际工具 Schema 通过 MCP initialize + tools/list 获取，只开放显式列出的工具。
# [[mcp.servers]]
# id = "research"
# transport = "stdio"
# command = "tools/websearch/.venv/bin/websearch-mcp"
# args = []
# timeout_ms = 30000
# [[mcp.servers.tools]]
# name = "web_search"
# capability_id = "research.search"
# description = "搜索网页，返回标题、链接和摘要"
# effect = "read_only"             # read_only / workspace_write；外部写入与删除暂不允许
# input_types = ["application/json"]
# output_types = ["application/json"]
#
# HTTP 服务使用 transport = "http"、url = "https://your-server.example/mcp"，
# 不填写 command/args；可用 bearer_env = "MCP_RESEARCH_TOKEN" 引用环境变量。
# 能力目录：GET /api/capabilities。协议、限制和计划见 docs/mcp/。
#
# 外发脱敏（tools/dlp-egress）不要配置成 [[mcp.servers]]：它由宿主通过下面的 [egress] 直接调用，不交给模型。

# ───── 外发检查（可选，默认 off）─────
# 宿主在登记的工具调用、云端 LLM 请求发出前，先交给 dlp-egress 判定。部署与注意事项见 docs/mcp/DLP_EGRESS_DEPLOYMENT.md。
# off：不检查（默认）；audit：检查并记录，从不拦截（建议先用）；enforce：拦截，只发送脱敏内容。
# [egress]
# mode = "audit"
# timeout_ms = 2000
# dlp_command = "tools/dlp-egress/.venv/bin/dlp-egress-mcp"
# dlp_args = ["--config", "tools/dlp-egress/config/dlp.example.yaml"]   # 宿主用的 DLP 配置需 allow_restore: true
# [[egress.tools]]                 # 内置工具名；MCP 工具写 服务id.工具名
# tool = "web_search"
# destination_id = "public-search"
# channel = "external_api"         # email / slack / external_api / file_upload / mcp / agent
# purpose = "web_research"
# [[egress.llm]]                   # 非本机地址的 LLM 后端必须登记（enforce 下不登记则拒绝启动）
# backend = "cloud"
# destination_id = "cloud-llm"
# purpose = "llm_inference"

# ───── AI 桌面壳（可选）─────
# test_fixtures：是否挂载 Resume 等测试夹具接口（/api/desktop/v1/resume/fixture/*）。
# 默认 false（生产不要开）；本地演示或 Playwright 夹具环境可改为 true（H4：夹具不得在生产可达）。
# [desktop]
# test_fixtures = false

# ───── MOM 运营沙盘 / 运营频道（可选，默认全关）─────
# chat_bridge：主服务挂载同源 /mom/ 与运营频道桥接；关闭时行为与早期版本相同。
# world_mock：打开 /api/world/mock（World Adapter 协议/实验 Mock）。
# des_mcp：模拟工厂命令（如 an-des-mcp）；空 = 不挂 DesConnector；也可用环境变量 AN_MOM_DES_MCP。
# [mom]
# chat_bridge = false
# ops_merge_secs = 60              # 同一案例卡片更新合并窗口（秒）
# ops_hourly_cap = 10              # 运营频道每小时最多新发几张卡
# world_mock = false
# des_mcp = ""

# ───── 业务内省（可选，默认关闭）─────
# 定时分析与发送闸门；本地第 6 线真实环境测试常显式打开。
# [introspection]
# enabled = false
# schedule_hours = 24              # 定时任务间隔（小时）
# timeout_secs = 120               # 单次分析超时
# min_samples = 10                 # 样本门槛
# push_threshold = 4.0             # 推送分数门槛
# daily_cap = 1                    # 每日最多推送几条
# operator_role = ""               # 预留，暂不生效
# model_explain = false            # 模型解释层（S7）；开则用后台槽位，取不到则跳过

# ───── 连接器注册表（契约 K 系列 connector.md，#398/#487）─────
# 外部系统统一在此注册（凭据用引用，K2）；未注册的直连会告警（先告警后拒绝）
# connectors_path = "connectors.toml"
