<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOM 运营公告板</title>
<style>
:root{font-family:Inter,"PingFang SC",system-ui,sans-serif;color:#e5edf8;background:#0d1421;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px;border-bottom:1px solid #293347;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:24px;margin:0 0 6px}p{margin:6px 0;color:#a4b3ca}button,select{padding:10px 14px;border:1px solid #43516a;border-radius:8px;background:#202d44;color:inherit;cursor:pointer}button:hover{background:#304564}button:disabled{opacity:.45;cursor:wait}.primary{background:#205dce}main{display:grid;grid-template-columns:260px 1fr;min-height:80vh}aside{padding:24px;border-right:1px solid #293347}article{padding:24px;min-width:0}.case{display:block;width:100%;text-align:left;margin:10px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#151f30;border:1px solid #2c3a51;border-radius:12px;padding:18px;margin-bottom:16px}.tag{display:inline-block;border:1px solid #8c6d21;color:#ffda7b;background:#493c1d;padding:3px 8px;border-radius:6px;font-size:12px}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;color:#a9bad2}pre{font-size:12px;white-space:pre-wrap;word-break:break-word;color:#b6c9e4;max-height:500px;overflow:auto}.node{padding:10px;border-left:3px solid #6391e8;margin:8px 0;background:#1d2a40}.warning{color:#ffd079}.success{color:#81d8af}#error{color:#ff9eaa;white-space:pre-wrap;padding:0 24px}details{margin:8px 0}small{color:#a4b3ca}label{display:block;margin-bottom:8px}@media(max-width:760px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #293347}header{padding:20px;align-items:start;flex-direction:column}article{padding:16px}}
</style></head><body>
<header><div><h1>MOM 运营公告板</h1><p>多扰动生产恢复 · 客诉闭环 · 一个共享事实来源</p></div><div><span class="tag">SIMULATION / 全域 Mock</span><p id="clock">等待状态</p></div></header>
<div id="error" role="alert"></div><main><aside><h2>运营案例</h2><div class="toolbar"><button data-scenario="s1">＋ 多扰动 S1</button><button data-scenario="s2">＋ 客诉 S2</button></div><div id="cases"></div><p><small>本机实验环境。测试主管身份不代表企业授权；不会发送真实客户消息或控制设备。</small></p></aside>
<article><div class="toolbar"><button id="human">人类运营视图</button><button id="agent">Agent 机器视图</button><button id="refresh">刷新</button></div><div id="content"><h2>新建或选择案例</h2><p>观察证据、审批、业务回执和能力缺口。所有结论保留来源及 Mock 标识。</p></div></article></main>
<script>
let selected=null,mode='human',current=null,busy=false;
const $=id=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function pretty(v){return JSON.stringify(v,null,2)}
async function api(path,body){const r=await fetch('/api/mom'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.error||pretty(v));return v}
async function action(fn){if(busy)return;busy=true;$('error').textContent='';try{await fn();await refresh()}catch(e){$('error').textContent=e.message}finally{busy=false}}
function button(text,fn,cls){const b=el('button',text,cls);b.onclick=()=>action(fn);return b}
async function command(body){return api('/cases/'+selected+'/commands',body)}
function card(title,data){const n=el('section',undefined,'card');n.append(el('h2',title));if(data!==undefined)n.append(el('pre',typeof data==='string'?data:pretty(data)));return n}
async function refresh(){const list=await api('/cases');$('clock').textContent='仿真分钟 '+list.now+' · '+list.cases.length+' 个案例';$('cases').replaceChildren();for(const c of list.cases){const b=button(c.case_id+'\n'+c.stage,async()=>{selected=c.case_id},'case');$('cases').append(b)}if(!selected)return;
current=await api('/cases/'+selected);render();}
function render(){const root=$('content');root.replaceChildren();root.append(el('h2',current.case_id+' · '+current.stage));root.append(el('p','事实版本 '+current.case_revision+' · 计划版本 '+current.plan_revision+' · 公告板序号 '+current.projection_seq));
const tools=el('div',undefined,'toolbar');tools.append(button('推进 1 分钟',()=>command({command:'advance',minutes:1})),button('推进 5 分钟',()=>command({command:'advance',minutes:5})),button('唤醒 Master',()=>api('/cases/'+selected+'/master',{})),button('更新证据与方案',()=>command({command:'refresh_plan'})),button('取消案例',()=>command({command:'cancel'})));root.append(tools);
if(mode==='agent'){const p=el('pre','读取中…','card');root.append(p);api('/cases/'+selected+'/agent?limit=20').then(v=>p.textContent=pretty(v)).catch(e=>p.textContent=e.message);return}
const grid=el('div',undefined,'grid');grid.append(card('硬约束',current.constraints),card('预算与 SLA',{budget:current.budget,deadlines:current.deadlines,alerts:current.alerts,breaches:current.breaches}));root.append(grid);
const decisions=card('主管决策 / 测试身份');decisions.append(el('p','批准仅适用于当前方案及资源条件，默认有效 5 仿真分钟。','warning'));
for(const scope of (current.scenario==='s1'?['production']:['initial_response','eight_d'])){const row=el('div',undefined,'toolbar');row.append(el('span',scope),button('批准',()=>command({command:'approve',scope,actor:'supervisor',plan_revision:current.plan_revision}),'primary'),button('执行已批准动作',()=>command({command:'execute',scope})));decisions.append(row)}
decisions.append(button('核验并关闭案例',()=>command({command:'close'})));root.append(decisions);
const dag=card('DAG / 任务与并行调查');for(const [id,n]of Object.entries(current.dag)){dag.append(el('div',id+' · '+n.status+' · '+n.tool+'\n依赖：'+(n.deps.join(', ')||'无'),'node'))}dag.append(el('pre',pretty(current.children)));root.append(dag);
if(current.proposal)root.append(card('排产方案与影响',current.proposal));if(current.initial_report)root.append(card('初复草稿 / 已知与未知',current.initial_report));if(current.eight_d)root.append(card('8D 进展与验证状态',current.eight_d));root.append(card('处置回执与模拟发件箱',{actions:current.actions,outbox:current.outbox}));
const evidence=card('证据与来源');for(const [id,v]of Object.entries(current.evidence)){const d=el('details');d.append(el('summary',id),el('pre',pretty(v)));evidence.append(d)}root.append(evidence);
const faults=card('实验故障注入');const opts=el('select');for(const key of ['resources_available','maintenance_timeout','quality_timeout','resource_conflict','dispatch_failure','lost_receipt','child_timeout','missing_genealogy','conflicting_records','root_cause_verified','effectiveness_verified']){const o=el('option',key);o.value=key;opts.append(o)}faults.append(opts,button('设为 true',()=>command({command:'fault',key:opts.value,value:true})),button('设为 false',()=>command({command:'fault',key:opts.value,value:false})));
if(current.scenario==='s2')faults.append(button('采集模拟现场验证',()=>command({command:'verify_complaint'})));root.append(faults);
root.append(card('能力缺口 / Mock 清单引用',{mock_ids:current.mock_ids,provenance:current.provenance,limitations:current.limitations,register:'docs/mom/MOCK_REGISTER.md'}));
const timeline=card('持久事件时间线');root.append(timeline);api('/cases/'+selected+'/events?limit=200').then(v=>timeline.append(el('pre',pretty(v)))).catch(e=>timeline.append(el('p',e.message)));}
for(const b of document.querySelectorAll('[data-scenario]'))b.onclick=()=>action(async()=>{const r=await api('/scenarios/'+b.dataset.scenario,{});selected=r.case_id});
$('human').onclick=()=>{mode='human';if(current)render()};$('agent').onclick=()=>{mode='agent';if(current)render()};$('refresh').onclick=()=>action(async()=>{});action(async()=>{});
</script></body></html>
