<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MOM 人类工作台 · 设计示意</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#203247;font:15px system-ui,"PingFang SC",sans-serif}header{background:#fff;border-bottom:1px solid #dde3ea;padding:18px 28px;display:flex;justify-content:space-between;gap:16px;align-items:center}header strong{font-size:21px}small,.muted{color:#68798a}.demo{background:#fff5d8;color:#775616;border:1px solid #ebd58b;border-radius:5px;padding:5px 9px;font-size:12px}.layout{display:grid;grid-template-columns:200px 1fr;min-height:90vh}nav{padding:24px 16px;background:#eaf0f4}nav button{display:block;text-align:left;width:100%;margin-bottom:9px;border:0;background:transparent}nav button.active{background:#fff;color:#145b9a;box-shadow:0 2px 8px #22334711}button{font:inherit;cursor:pointer;padding:10px 13px;border-radius:7px;border:1px solid #ccd6df;background:white;color:#294a6b}button:hover{border-color:#4381b7}button.primary{background:#2168a8;color:#fff;border-color:#2168a8}.workspace{padding:26px;max-width:1600px;width:100%}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px}h3{font-size:16px;margin:0 0 9px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:16px}.card{padding:20px;background:white;border:1px solid #dde4eb;border-radius:10px;margin-bottom:16px}.card p{line-height:1.65;margin:10px 0}.tag{display:inline-block;padding:4px 8px;border-radius:5px;font-size:12px;background:#eef3f8;color:#45617b;margin-right:5px}.urgent{background:#fff0ed;color:#a74639}.wait{background:#fff4d7;color:#8c6516}.ok{background:#eaf5ef;color:#35724d}.metric{font-size:28px;margin-right:8px}.columns{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.detail{background:#edf3f9;align-self:start;position:sticky;top:16px}.progress{display:flex;gap:8px;align-items:center;margin:18px 0;flex-wrap:wrap}.step{padding:8px 12px;background:#edf1f5;border-radius:6px}.step.current{background:#e1effb;color:#1c609c;font-weight:600}.node{padding:16px;background:#fff;border:1px solid #c8d4df;border-left:4px solid #4685bd;border-radius:8px;margin:10px 0;min-height:105px}.node p{font-size:13px}.flow{display:grid;grid-template-columns:1fr 1.3fr 1.1fr 1.2fr;gap:18px;align-items:center}.gateway{border:2px dashed #ceab4d;background:#fff9e8}.connector{text-align:center;color:#617c93;font-size:13px}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:13px;border-bottom:1px solid #e2e8ee}th{color:#526b80;font-weight:500;background:#f8fafb}.bar{background:#e6eff8;padding:10px;border-radius:5px;font-size:13px}.bar.busy{background:#fce9e4;border:1px solid #e5b0a4}.bar.planned{border:1px dashed #91adc6;background:transparent}.note{border-left:3px solid #7291ac;padding:12px;background:#edf2f6;font-size:13px;line-height:1.7}a{color:#2168a8}footer{font-size:12px;color:#6e7f8e;padding:14px 0}@media(max-width:1000px){.columns{grid-template-columns:1fr}.detail{position:static}.grid{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.layout{grid-template-columns:160px 1fr}}@media(max-width:650px){header{display:block}.layout{display:block}nav{display:flex;overflow:auto;padding:10px}nav button{min-width:110px}.workspace{padding:16px}.flow{grid-template-columns:1fr}}
</style></head><body>
<header><div><strong>制造运营工作台</strong><div class="muted">示例工厂 · 机加工车间 · 日班　｜　角色示意：张主管</div></div><div class="demo">低保真设计 · 全部为虚构样例 · 不连接业务系统、不保存操作</div></header>
<div class="layout"><nav aria-label="设计页面"><button data-page="mine" class="active">我的工作</button><button data-page="team">车间公告板</button><button data-page="flow">事项与流程</button><button data-page="resources">资源协调</button><button data-page="handover">交接记录</button><hr><small>沙盘、技术诊断与流程管理在正式产品中按角色开放。</small></nav><main class="workspace"><div id="page"></div><footer>评估基线：master 31c8227；参考未合并 PR49。页面仅演示信息结构，图中能力不代表当前运行时已支持。<a href="HUMAN_BOARD_UX.md">查看完整方案</a></footer></main></div>
<script>
const root=document.getElementById('page');
const detail=`<aside class="card detail"><h2>这件事意味着什么</h2><p>设备异常可能影响今天16:00前交付的500件插单。</p><span class="tag wait">原因仍在核实</span><p><strong>业务负责人</strong><br>计划组 · 待指定具体人员</p><p><strong>系统处理</strong><br>排产助手 · 已完成资源核对</p><p><strong>目前阻塞</strong><br>等待主管确认停机与订单影响</p><p class="muted">这里区分人类责任人与系统执行者；真实身份与权限仍需接入。</p></aside>`;
const views={
mine:()=>`<h1>我的工作</h1><p class="muted">先处理必须由你决定或确认的事项。样例信息截至08:36。</p><div class="grid"><div class="card"><span class="metric">2</span>待我决定</div><div class="card"><span class="metric">3</span>等待他人</div><div class="card"><span class="metric">1</span>需交班跟进</div></div><div class="columns"><div><section class="card"><span class="tag urgent">影响交付</span><span class="tag">B线 / 插单A</span><h2>确认设备停机与备用产能方案</h2><p>建议停用CNC-XX，使用XY/XZ分担生产。预计15:40检验放行；既有订单B预计顺延30分钟。</p><p><strong>需要你做：</strong>确认对交付和其他订单的影响。未批准前不下发。</p><div class="toolbar"><button class="primary" data-show="decision">查看方案并决定</button><button data-go="flow">查看处置进度</button></div></section><section class="card"><span class="tag wait">13:00前初复</span><h2>审核客户A的首次回复</h2><p>仓库已反馈冻结范围；根因尚未验证。初复可以说明遏制措施与下一次更新时间。</p><button data-show="complaint">查看回复与未知项</button></section><section class="card"><h2>我关注的承诺</h2><p>维修组：09:10前提交检查结果　<span class="tag">等待他人</span></p><p>质量组：10:00前确认复检安排　<span class="tag">未到期</span></p></section></div>${detail}</div>`,
team:()=>`<h1>车间公告板</h1><div class="toolbar"><span class="tag">范围：机加工日班</span><span class="tag">只看重大变化</span><small>与个人工作台共享事项事实，按权限显示。</small></div><div class="grid"><section class="card"><span class="tag urgent">生产异常</span><h2>B线设备异常，插单交付有风险</h2><p>影响：插单A 500件。设备已进入受限使用状态，待确认替代方案。</p><p>负责人：计划组<br>下一次更新：09:10</p><button data-go="flow">查看影响与进度</button></section><section class="card"><span class="tag ok">已生效决定</span><h2>C101批次暂缓出库</h2><p>范围：库内200件。客户侧已交付的300件另行评估，不能视为已召回。</p><p>发布：质量负责人<br>截至：08:35</p><button data-show="containment">查看范围和依据</button></section><section class="card"><span class="tag">班组通知</span><h2>交班前补齐首件检验记录</h2><p>收货、加工与复检记录需要批次对应。缺失材料的事项不得标为已核验。</p><p>可见范围：本班组<br>这是通知，不是生产执行授权。</p></section></div><div class="note">团队公告板展示关键变化、决定和承诺，不逐条广播全部Agent日志。私有便签与未发布草稿不出现在这里。</div>`,
flow:()=>`<h1>B线插单恢复 · 处置流程</h1><p class="muted">业务示意：当前运行第2版；不可拖动节点修改在线流程。</p><div class="progress"><span class="step">异常受理 ✓</span>→<span class="step">并行核对 ✓</span>→<span class="step current">等待主管决定</span>→<span class="step">现场执行</span>→<span class="step">效果核验</span></div><div class="toolbar"><span class="tag">默认：业务依赖视图</span><button data-go="resources">查看其他事项的资源冲突</button><button data-show="branch">说明分支与汇合</button></div><div class="card"><div class="flow"><div><div class="node"><strong>异常受理</strong><p>订单、设备与批次关联</p><span class="tag ok">已完成</span></div><div class="connector">同时核对 →</div></div><div><div class="node"><strong>设备情况核对</strong><p>设备助手；原因仍待现场确认</p><span class="tag ok">核对完成</span></div><div class="node"><strong>质量范围确认</strong><p>质量组；已留隔离记录</p><span class="tag ok">已确认范围</span></div><div class="node"><strong>备用资源核对</strong><p>刀具、工艺资格与检验能力</p><span class="tag ok">已核对</span></div></div><div><div class="node"><strong>汇合：必要证据已就绪</strong><p>不是“任意一路返回就算完成”</p></div><div class="node gateway"><strong>有合规可行方案？</strong><p>是 → 主管决定<br>否 → 交期/资源升级<br>未知 → 补充材料</p></div></div><div><div class="node gateway"><strong>主管确认方案</strong><p>待张主管；尚未下发</p><span class="tag wait">待我决定</span><p><button data-show="decision">查看批准范围</button></p></div><div class="node"><strong>现场执行与核验</strong><p>未到执行阶段</p><span class="tag">等待上游</span></div></div></div></div><div class="note">补充根因调查独立进行：不阻断“排除异常设备”的保守方案，但不能据未知结论批准继续使用异常设备。图形仅作方案示意，通用条件执行器尚需补齐。</div>`,
resources:()=>`<h1>跨事项资源协调</h1><p class="muted">只显示相关事项和共享资源；不把全车间节点混成一张大图。</p><div class="toolbar"><span class="tag">按资源查看</span><span class="tag">时间示意：09:00—11:00</span><button data-go="flow">返回插单A流程</button></div><section class="card"><table><thead><tr><th>资源</th><th>当前/计划使用</th><th>等待与冲突</th></tr></thead><tbody><tr><td>CNC-XY</td><td><div class="bar">订单B：正在加工，释放时间待确认</div></td><td><div class="bar busy">插单A：等待同一资源</div></td></tr><tr><td>CNC-XZ</td><td><div class="bar planned">插单A：拟用240件产能，尚未预留</div></td><td>刀具调拨尚需回执</td></tr><tr><td>质量检验人员</td><td><div class="bar">复检C101与首件检验需协调</div></td><td>交期风险优先评估，不能重复承诺同一时段</td></tr></tbody></table></section><div class="grid"><section class="card"><h2>交付影响</h2><p>调整顺序可能影响订单B30分钟。建议需要主管确认，不能仅按“先来先做”。</p></section><section class="card"><h2>共享证据</h2><p>两个事项可以引用同一维修报告，不代表可以合并客户数据或重复下维修单。</p></section><section class="card"><h2>当前能力边界</h2><p>本图是拟议资源读模型；现有粗粒度预留尚不支持此精度或保证最优排程。</p></section></div>`,
handover:()=>`<h1>交接记录</h1><p class="muted">交班确认不等于业务完成，也不自动释放风险产品。</p><section class="card"><h2>日班 → 中班 · 待交接</h2><p><strong>事项：</strong>B线插单A恢复</p><p><strong>未完成：</strong>设备检查结果、备用机首件核验</p><p><strong>不能越过的边界：</strong>未核验前不得恢复XX；客户投诉批次不得自行解冻。</p><p><strong>下一次承诺：</strong>09:10由维修组反馈；若未到应升级给值班主管。</p><p><strong>接班人：</strong>待指定并逐项确认</p><button data-show="handover">查看交接确认内容</button></section><div class="note">正式实现需增加人类工作项、身份和可见性、交接责任及审计；当前原型不保存任何确认。</div>`};
function show(page){root.innerHTML=views[page]();for(const b of document.querySelectorAll('[data-page]'))b.classList.toggle('active',b.dataset.page===page);bind()}
const messages={decision:'拟议决策详情：列明停机、调拨、改排产的具体范围；对比交期、其他订单影响、证据时间与未知项。当前仅为原型，不执行批准。',complaint:'初复应说明已确认事实、冻结的实际范围、尚未验证的根因和下一次更新时间；未经审核不发送。',containment:'库内冻结与客户侧风险分开显示。已读不等于批准解冻，任务完成也不等于质量放行。',branch:'AND：等待全部必要输入；XOR：只走一条确定路径；OR：等待本次激活的必要路径。未选路径不是失败，条件未知不是默认通过。',handover:'接班人确认接手哪些事项、风险边界与承诺；缺失材料可请求澄清。这是设计说明，没有提交任何业务操作。'};
function bind(){for(const b of root.querySelectorAll('[data-go]'))b.onclick=()=>show(b.dataset.go);for(const b of root.querySelectorAll('[data-show]'))b.onclick=()=>{let box=document.getElementById('explanation');if(!box){box=document.createElement('div');box.id='explanation';box.className='card note';root.prepend(box)}box.textContent=messages[b.dataset.show];box.scrollIntoView({behavior:'smooth',block:'start'})}}
for(const b of document.querySelectorAll('[data-page]'))b.onclick=()=>show(b.dataset.page);show('mine');
</script></body></html>
