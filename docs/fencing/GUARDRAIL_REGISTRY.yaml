    schedule: [pr, daily]
    owner: "用户"
    status: monitored
    evidence_level: DECLARED
    evidence:
      - "AGENTS.md「开始前」「决策记录」"
      - "2026-11-21 PR #187 的会话在合并 master 时自行改用 docs/decisions/ 单文件（部分遵守的实例）"
    last_verified: "2026-11-21"
    positive_test: null
    negative_test: null
    exception: null
    review_due: "2026-11-28"

  # ---------- 第三层：开发执行与隔离 ----------
  - id: GR-3-CHANGE-SIZE
    layer: 3
