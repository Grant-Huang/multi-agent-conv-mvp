# 七层围栏登记表：现有围栏的唯一机器可读清单。
# 规则见 docs/fencing/README.md 第 5 节；证据等级定义见 DEV_STANDARD.md 第 8 节。
#
# 字段：
#   status          proposed | approved | pilot-warning | enforced | monitored | revised | retired
#   evidence_level  DECLARED | IMPLEMENTED | VERIFIED | ENFORCED | NOT_VERIFIED（是证据等级，不是部署状态）
#   enforcement     这条围栏靠什么生效；写清是否阻断
#   evidence        能点开或复现的证据：文件、运行编号、PR 编号
#   exception       例外与到期日；没有写 null
#
# 维护：同一时间只由一个治理 PR 修改本文件。升为 enforced、降低强度、停用高风险规则须用户批准；
# agent 不得给自己签署 enforced。
#
# 说明：本仓库分支保护的实际设置在云会话中读不到（NOT_VERIFIED），所以下面没有任何一条的
# evidence_level 写成 ENFORCED，即使 docs/fencing/BRANCH_PROTECTION.md 建议把它设为必需检查。

schema_version: 1
repo: Grant-Huang/multi-agent-conv-mvp
default_branch: master
last_audit:
  baseline_sha: "33b2d05"
  checked_at: "2026-11-24"
  by: "Claude Code 会话（更新 GR-2-DOC-LINT、GR-4-NIGHTLY-E2E；初次登记 2026-11-21 于 152ea0d）"
  unknowns:
    - "分支保护 / Rulesets 的实际设置（必需检查、审批数、是否允许绕过）"
    - "开发 agent 是否已有独立身份（BOT_IDENTITY 阶段 2）"

guardrails:
  # ---------- 第一层：需求边界与验收 ----------
  - id: GR-1-FEATURE-MAP
    layer: 1
    objective: "登记表 features.json 中的用例编号必须在 CASES.md 中存在（T1 结构追踪）"
    enforcement: "CI web 作业运行 npm run test:map；失败即作业失败"
    schedule: [pr, weekly]
    owner: "用户（维护）；实现会话（同步登记表）"
    status: monitored
    evidence_level: VERIFIED
    evidence:
      - ".github/workflows/ci.yml web 作业 `npm run test:map`"
      - "web/verification/check-map.test.mjs（未知用例被拒的反例测试）"
      - "PR #193 CI web 作业通过（run 44942724424）"
    last_verified: "2026-11-21"
    positive_test: "登记的用例都存在时通过"
    negative_test: "check-map.test.mjs：unknown cases are rejected"
    exception: null
    review_due: "2026-11-28"

  - id: GR-1-PR-TEMPLATE
    layer: 1
    objective: "PR 写明关联编号、非目标、风险与回滚、验证证据、设计一致性"
    enforcement: "PR 模板（提示，不阻断）；change_size_check 对非文档 PR 缺“非目标”/Case ID 给警告；doc_lint 对缺“设计一致性”给警告"
    schedule: [pr]
    owner: "用户"
    status: monitored
    evidence_level: IMPLEMENTED
    evidence:
      - ".github/pull_request_template.md"
    last_verified: "2026-11-21"
    positive_test: null
    negative_test: null
    exception: null
    review_due: "2026-11-28"

  # ---------- 第二层：产品知识与架构契约 ----------
  - id: GR-2-DOC-LINT
    layer: 2
    objective: "新增内容中的坏链接与锚点、决策文件格式、往 DECISIONS.md 追加编号、新设计文档未登记、PR 缺设计一致性"
    enforcement: "CI change-policy 作业“文档检查（只警告）”步骤；脚本默认退出码 0，另加 continue-on-error"
    schedule: [pr]
    owner: "用户（批准升级）；实现会话（维护脚本）"
    status: pilot-warning
    evidence_level: VERIFIED
    evidence:
      - "tools/ci/doc_lint.py；tools/ci/tests/test_doc_lint.py（22 个用例，Red 15 失败 → Green）"
      - "2026-11-24 必备小节改为前缀匹配（允许“定了什么（补充说明）”）：新增 2 个用例，Red 1 失败 → Green，tools/ci 共 113 passed"
      - "PR #193 change-policy 输出“文档检查：0 条发现（只警告，不阻断）”（run 44942724424）"
      - "在 T-50 分支上实测报出决策格式缺字段与缺小节"
      - "decisions/2026-11-21-doc-rules-enforcement.md"
    last_verified: "2026-11-24"
    positive_test: "test_well_formed_decision_passes、test_section_heading_with_parenthetical_note_counts 等"
    negative_test: "test_broken_relative_link_in_added_line_warns、test_appending_numbered_entry_to_decisions_md_warns 等"
    exception:
      kind: "continue-on-error（试点只警告）"
      owner: "用户"
      reason: "让进行中的分支有一周时间改用新写法；2026-11-24 延期一周：用新规则扫描，2026-11-21 以来仍有 7 个决策文件缺小节，到期直接阻断会同时卡住多条工作线"
      mitigation: "警告出现在 CI 日志与 risk-report 构件 doc-lint.json；7 个文件由各自工作线补齐（审查报告 2026-11-24 第 3a 项）"
      expires_at: "2026-12-05"
      exit_plan: "到期时若 7 个文件已补齐，去掉 continue-on-error，只对本 PR 新增或修改的决策文件阻断，不追溯旧文件；改 ci.yml 属 L3，另出方案"
    review_due: "2026-12-05"

  - id: GR-2-ENTRY-RULES
