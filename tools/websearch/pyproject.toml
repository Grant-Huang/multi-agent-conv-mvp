[project]
name = "agent-websearch"
version = "0.1.0"
description = "给 agent 用的网页搜索与抓取工具：Python 函数、CLI、MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.0",
    "httpx>=0.27",
    "lxml>=5.0",
]

[project.optional-dependencies]
extract = ["trafilatura>=2.0"]
mcp = ["mcp>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "flake8>=7.0",
    "mcp>=2.0",
]

[project.scripts]
websearch = "agent_websearch.cli:main"
websearch-mcp = "agent_websearch.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_websearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: 访问真实网络的测试，默认跳过，用 -m live 运行"]

[tool.coverage.run]
source = ["agent_websearch"]

[tool.coverage.report]
fail_under = 80
show_missing = true
