[package]
name = "an-agents"
version.workspace = true
edition.workspace = true

# 三个 Agent 的实现：General（内置 LLM + 工具）、Reviewer（内置只读评估）、Coding（外部 Codex CLI）
[dependencies]
an-core.workspace = true
an-llm.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
reqwest.workspace = true
futures.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
jsonschema = { version = "0.61", default-features = false }
agent-client-protocol = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio.workspace = true
axum.workspace = true
