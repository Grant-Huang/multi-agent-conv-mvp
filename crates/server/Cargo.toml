[package]
name = "an-server"
version.workspace = true
edition.workspace = true

# HTTP API + SSE 事件流 + 静态前端；另含路由评测工具 an-eval
[[bin]]
name = "agentnexus"
path = "src/main.rs"

[[bin]]
name = "an-eval"
path = "src/bin/eval.rs"

# 假的 ACP agent：测试用，也可用于零依赖体验 ACP 接入
[[bin]]
name = "an-mock-acp"
path = "src/bin/mock_acp_agent.rs"

[dependencies]
an-core.workspace = true
an-llm.workspace = true
an-runtime.workspace = true
an-observe.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
agent-client-protocol = { workspace = true, features = ["stdio"] }
# E1-C：an-mom 调用 RelOS 上下文接口（工作区已有依赖，an-llm、an-agents 同样使用）
reqwest.workspace = true
# 阶段⑤a-2：模拟工厂连接器（经 stdio 调用 an-des-mcp；工具目录与类别来自 an-des）
an-des.workspace = true
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-async-rw"] }

[dev-dependencies]
mom-external-adapter = { git = "https://github.com/Grant-Huang/MOM-MCP.git", rev = "5aa312939df2110ff3dda401b9021a0c1ad5a67f" }
an-node.workspace = true
# E3 撤权实测示例直接构造外部 agent 适配器
an-agents.workspace = true
toml.workspace = true
# RT-SMAT-05：捕获 session.materials 事件断言不含正文
tracing-subscriber.workspace = true
# RT-L2H-03：回填 180 天窗口外的 created_at（REQ-05 检索窗口语义）
rusqlite.workspace = true
