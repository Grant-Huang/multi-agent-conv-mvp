# AgentNexus MVP —— Rust 工作区
# crates 之间的依赖方向（只能从上往下依赖）：
#   server  ->  runtime  ->  agents  ->  llm  ->  core
#   node    ->  agents（节点只负责在本机执行 agent）
#   observe：日志与诊断，被 server / node 共用
#   runtime ->  des（模拟工厂内核，不依赖其他 crate）
#   des-mcp ->  des（模拟工厂的 MCP stdio 服务）
[workspace]
resolver = "2"
members = ["crates/core", "crates/observe", "crates/llm", "crates/agents", "crates/runtime", "crates/node", "crates/server", "crates/des", "crates/des-mcp"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# 统一管理第三方依赖版本，各 crate 用 `xxx.workspace = true` 引用
[workspace.dependencies]
an-core = { path = "crates/core" }
an-llm = { path = "crates/llm" }
an-agents = { path = "crates/agents" }
an-runtime = { path = "crates/runtime" }
an-observe = { path = "crates/observe" }
an-node = { path = "crates/node" }
an-des = { path = "crates/des" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", features = ["preserve_order"] }
serde_ignored = "0.1"
tokio = { version = "1", features = ["full"] }
# 子进程按进程组结束（killpg），只在 Unix 上使用
libc = "0.2"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
# 握手检测自己启动子进程时，把 tokio 的管道转成 ACP SDK 需要的 futures 读写接口
tokio-util = { version = "0.7", features = ["compat"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs", "trace"] }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
mdns-sd = "0.22"
ts-rs = { version = "12", features = ["serde-json-impl"] }
# ACP 官方 Rust SDK：process 用于启动 agent 子进程，stdio 用于假 agent（测试/演示）
agent-client-protocol = "5"

# DES 仿真测试的耗时主要在 an-runtime 的 MOM 引擎侧（每次 update 克隆整个
# Snapshot 并全量 JSON 序列化写 mom_snapshot，批量仿真 200 runs × 60 分钟逐分钟
# 推进，见 crates/runtime/src/mom/des/batch.rs run_one），an-des 本体开优化无
# 收益（实测 42.40s → 43.79s）。对 an-runtime 单包开 opt-level=2：不对整个
# 工作区开（编译变慢），其他 crate 仍是调试构建，断言/溢出检查不受影响。
# 仿真内核 run_open_loop 在 an-des，也一并保留 opt-level=2。Issue #459。
[profile.dev.package.an-des]
opt-level = 2
[profile.dev.package.an-runtime]
opt-level = 2
